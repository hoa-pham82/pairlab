# pairlab platform stack
# Usage:
#   core only:      docker compose -f platform/compose.yml --env-file ../.env --profile core up -d
#   + streaming:    docker compose -f platform/compose.yml --env-file ../.env --profile core --profile stream up -d
#   + platform:     docker compose -f platform/compose.yml --env-file ../.env --profile core --profile stream --profile platform up -d
#   + ml:           add --profile ml         (MLflow)
#   + obs:          add --profile obs        (Prometheus, Grafana, cAdvisor, Pushgateway)
#   + llm:          add --profile llm        (llama.cpp — requires models/ dir, see scripts/download_model.sh)
#   + gateway:      add --profile gateway    (NGINX: Basic Auth + rate-limit + HTTPS on port 8443/8444)
#   all:            docker compose -f platform/compose.yml --env-file ../.env --profile core --profile stream --profile platform --profile ml --profile obs --profile llm --profile gateway up -d
# Note: --env-file ../.env is required so MINIO_ROOT_USER / MINIO_ROOT_PASSWORD are resolved.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ──────────────────────────────────────────────────────────
  # CORE profile: PostgreSQL · MinIO · Redis
  # ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    profiles: [core]
    environment:
      POSTGRES_USER: pairlab
      POSTGRES_PASSWORD: pairlab
      POSTGRES_DB: pairlab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./warehouse/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pairlab -d pairlab"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # LocalStack provides S3-compatible storage (same API as MinIO).
  # Use: AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}, AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD},
  #      endpoint_url=http://minio:4566  (S3-compatible; port kept at 4566 for compatibility)
  minio:
    image: cgr.dev/chainguard/minio:latest
    profiles: [core]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --address ":4566" --console-address ":9001"
    ports:
      - "4566:4566"   # S3 API
      - "9001:9001"   # MinIO console (http://localhost:9001)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/4566' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging

  minio-init:
    image: amazon/aws-cli:latest
    profiles: [core]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
        aws --endpoint-url http://minio:4566 s3 mb s3://vendor-raw      2>/dev/null || true &&
        aws --endpoint-url http://minio:4566 s3 mb s3://delta-lake       2>/dev/null || true &&
        aws --endpoint-url http://minio:4566 s3 mb s3://mlflow-artifacts 2>/dev/null || true &&
        echo 'S3 buckets ready'
      "
    logging: *default-logging

  redis:
    image: redis:7-alpine
    profiles: [core]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ──────────────────────────────────────────────────────────
  # STREAM profile: Redpanda · Flink
  # ──────────────────────────────────────────────────────────

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    profiles: [stream]
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --default-log-level=warn
    ports:
      - "18081:18081"  # schema registry
      - "18082:18082"  # pandaproxy
      - "19092:19092"  # kafka external
      - "9644:9644"    # admin
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    logging: *default-logging

  redpanda-console:
    image: redpandadata/console:v2.5.2
    profiles: [stream]
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      CONFIG_FILEPATH: /etc/redpanda-console/config.yaml
    volumes:
      - ./docker/redpanda-console-config.yaml:/etc/redpanda-console/config.yaml:ro
    ports:
      - "8080:8080"
    logging: *default-logging

  redpanda-init:
    image: redpandadata/redpanda:v24.1.1
    profiles: [stream]
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "
        rpk --brokers redpanda:9092 topic create ticks.raw --partitions 4 --replicas 1 2>/dev/null || true &&
        rpk --brokers redpanda:9092 topic create bars.1m   --partitions 4 --replicas 1 2>/dev/null || true &&
        echo 'Redpanda topics ready'
      "
    logging: *default-logging

  flink-jobmanager:
    image: flink:1.19-scala_2.12
    profiles: [stream]
    # copy connector JARs from the mounted staging dir into /opt/flink/lib/ at startup
    entrypoint: >
      sh -c "cp /opt/flink/extra-jars/*.jar /opt/flink/lib/ 2>/dev/null || true; exec /docker-entrypoint.sh jobmanager"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        state.backend: hashmap
        execution.checkpointing.interval: 30s
    ports:
      - "8081:8081"   # Flink Web UI
    volumes:
      - flink_checkpoints:/tmp/flink-checkpoints
      # connector JARs — run platform/flink/download_jars.sh first
      - ./flink/jars:/opt/flink/extra-jars:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *default-logging

  flink-taskmanager:
    image: flink:1.19-scala_2.12
    profiles: [stream]
    entrypoint: >
      sh -c "cp /opt/flink/extra-jars/*.jar /opt/flink/lib/ 2>/dev/null || true; exec /docker-entrypoint.sh taskmanager"
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ./flink/jars:/opt/flink/extra-jars:ro
    scale: 1
    logging: *default-logging

  # ──────────────────────────────────────────────────────────
  # PLATFORM profile: Spark · Airflow
  # ──────────────────────────────────────────────────────────

  # Stream job 2: bars.1m → Feast online store (Redis). Job 1 is the Flink SQL job.
  online_writer:
    build:
      context: ..
      dockerfile: services/online_writer/Dockerfile
    image: pairlab-online_writer:${ONLINE_WRITER_TAG:-latest}
    profiles: [stream]
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      BARS_TOPIC: bars.1m
      CONSUMER_GROUP: online-writer
      FEAST_REPO: /app/platform/feature_repo
      FEAST_FS_YAML_FILE_PATH: /app/platform/feature_repo/feature_store.docker.yaml
    ports:
      - "9108:9108"   # Prometheus metrics
    restart: unless-stopped
    logging: *default-logging

  spark-master:
    image: apache/spark:3.5.3
    profiles: [platform]
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_WEBUI_PORT: "8082"
      SPARK_MASTER_PORT: "7077"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "8082:8082"   # Spark Master Web UI
      - "7077:7077"   # Spark Master RPC
    volumes:
      - ./spark/jars:/opt/spark/extra-jars:ro
      - ./spark/jobs:/opt/spark/jobs:ro
      - ./spark/conf:/opt/spark/conf:ro
      - spark_warehouse:/opt/spark/warehouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

  spark-worker:
    image: apache/spark:3.5.3
    profiles: [platform]
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: "2"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./spark/jars:/opt/spark/extra-jars:ro
      - ./spark/jobs:/opt/spark/jobs:ro
      - ./spark/conf:/opt/spark/conf:ro
    logging: *default-logging

  airflow:
    build:
      context: ./docker
      dockerfile: airflow.Dockerfile
    profiles: [platform]
    depends_on:
      postgres:
        condition: service_healthy
    # AIRFLOW__CORE__FERNET_KEY comes from the git-ignored repo-root .env
    env_file: ../.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://pairlab:pairlab@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "pairlab-dev-secret"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      # Connection strings (accessible as AIRFLOW_CONN_* or via UI)
      AIRFLOW_CONN_POSTGRES_DWH: "postgresql://pairlab:pairlab@postgres:5432/pairlab"
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077"
      AIRFLOW_CONN_MINIO_S3: "s3://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:4566"
      # Variables
      AIRFLOW_VAR_MINIO_ENDPOINT: "http://minio:4566"
      AIRFLOW_VAR_MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
      AIRFLOW_VAR_MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      AIRFLOW_VAR_SPARK_MASTER: "spark://spark-master:7077"
      AIRFLOW_VAR_S3_ENDPOINT: "http://minio:4566"
      AIRFLOW_VAR_PG_JDBC_URL: "jdbc:postgresql://postgres:5432/pairlab"
      AIRFLOW_VAR_COINT_PAIRS: "KO:PEP,XOM:CVX,JPM:BAC,GS:MS"
      # ML venv env vars (used by ml_train_dag and ml_drift_dag)
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD: "false"
      POSTGRES_URL: "postgresql://pairlab:pairlab@postgres:5432/pairlab"
      S3_ENDPOINT: "http://minio:4566"
      # Use the Docker variant of feature_store.yaml (postgres/redis service names)
      FEAST_FS_YAML_FILE_PATH: "/opt/airflow/feature_repo/feature_store.docker.yaml"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark/jobs:/opt/airflow/spark_jobs:ro
      # rw: feast apply and materialize write the registry file under data/
      - ./feature_repo:/opt/airflow/feature_repo
      - ../ml:/opt/airflow/ml:ro
      - airflow_logs:/opt/airflow/logs
      # docker.sock lets BashOperators run `docker exec spark-master spark-submit ...`
      # LOCAL DEMO ONLY — gives Airflow full control of the Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8083:8080"   # Airflow Web UI
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Hoa --lastname Pham --role Admin --email phamtthanhhoa@gmail.com &&
        { airflow scheduler & exec airflow webserver; }
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    logging: *default-logging

  # ──────────────────────────────────────────────────────────
  # SECRETS profile: Vault (dev mode) + vault-init
  # Access: http://localhost:8200  Token: VAULT_TOKEN from .env
  # Paths seeded: secret/minio, secret/postgres, secret/gateway
  # ──────────────────────────────────────────────────────────

  vault:
    image: hashicorp/vault:1.17
    profiles: [secrets]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-pairlab-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add: [IPC_LOCK]
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://localhost:8200 2>/dev/null | grep -q 'Initialized.*true' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging

  vault-init:
    image: hashicorp/vault:1.17
    profiles: [secrets]
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-pairlab-root}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      GATEWAY_USER: ${GATEWAY_USER:-pairlab}
      GATEWAY_PASSWORD: ${GATEWAY_PASSWORD:-pairlab}
    volumes:
      - ./docker/vault-init.sh:/vault-init.sh:ro
    entrypoint: ["/bin/sh", "/vault-init.sh"]
    restart: "no"
    logging: *default-logging

  # ──────────────────────────────────────────────────────────
  # ML profile: MLflow · signal_api · regime_api
  # ──────────────────────────────────────────────────────────

  mlflow:
    build:
      context: ./docker
      dockerfile: mlflow.Dockerfile
    profiles: [ml]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:4566
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: >
      server
        --backend-store-uri postgresql+psycopg2://pairlab:pairlab@postgres:5432/mlflow
        --artifacts-destination s3://mlflow-artifacts
        --serve-artifacts
        --host 0.0.0.0
        --port 5000
        --workers 1
        --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5001,localhost:5000,127.0.0.1,127.0.0.1:5001
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging

  signal_api:
    build:
      context: ..
      dockerfile: services/signal_api/Dockerfile
    profiles: [ml]
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      FEAST_REPO: /app/platform/feature_repo
      FEAST_FS_YAML_FILE_PATH: /app/platform/feature_repo/feature_store.docker.yaml
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD: "false"
      TAKE_THRESHOLD: "0.6"
      CHALLENGER_SHARE: "0.5"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-pairlab-root}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  regime_api:
    build:
      context: ..
      dockerfile: services/regime_api/Dockerfile
    profiles: [ml]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://pairlab:pairlab@postgres:5432/pairlab
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ──────────────────────────────────────────────────────────
  # OBS profile: Prometheus · Grafana
  # ──────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.52.0
    profiles: [obs]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.4.2
    profiles: [obs]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana-datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./docker/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/pairlab.yml:ro
      - ./docker/grafana-dashboard-pairlab.json:/etc/grafana/provisioning/dashboards/pairlab-main.json:ro
    ports:
      - "3000:3000"
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: [obs]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8084:8080"
    logging: *default-logging

  pushgateway:
    image: prom/pushgateway:v1.8.0
    profiles: [obs]
    ports:
      - "9091:9091"
    logging: *default-logging

  loki:
    image: grafana/loki:2.9.10
    profiles: [obs]
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    logging: *default-logging

  promtail:
    image: grafana/promtail:2.9.10
    profiles: [obs]
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./docker/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.5.0
    profiles: [obs]
    command: -config.file=/etc/tempo/tempo-config.yaml
    volumes:
      - ./docker/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    logging: *default-logging

  # ──────────────────────────────────────────────────────────
  # LLM profile: llama.cpp inference server
  # ──────────────────────────────────────────────────────────
  # Before starting: download model file to models/ (git-ignored)
  # e.g. models/qwen2.5-3b-instruct-q4_k_m.gguf from Hugging Face
  # Run:  bash scripts/download_model.sh

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: [llm]
    volumes:
      - ../models:/models:ro
    command: >
      --model /models/qwen2.5-3b-instruct-q4_k_m.gguf
      --host 0.0.0.0
      --port 8080
      --jinja
      --metrics
      -np 2
      -c 4096
      -t 5
    ports:
      - "8085:8080"
    logging: *default-logging

  # ──────────────────────────────────────────────────────────
  # LLM profile: MCP server + analyst agent API
  # Both share the signal_api image (fastmcp + httpx already installed)
  # ──────────────────────────────────────────────────────────

  mcp_server:
    build:
      context: ..
      dockerfile: services/signal_api/Dockerfile
    profiles: [llm]
    command: ["python", "-m", "services.mcp_server.server"]
    environment:
      SIGNAL_API_URL: http://signal_api:8000
      REGIME_API_URL: http://regime_api:8001
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      signal_api:
        condition: service_healthy
      regime_api:
        condition: service_healthy
    logging: *default-logging

  agent_api:
    build:
      context: ..
      dockerfile: services/signal_api/Dockerfile
    profiles: [llm]
    command: ["uvicorn", "services.agent.app:build_default_app", "--factory", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      LLM_BASE_URL: http://llama-cpp:8080
      MCP_URL: http://mcp_server:8002/mcp
      CHALLENGER_SHARE: "0.5"
      CHAMPION_PROMPTS: default
      CHALLENGER_PROMPTS: brief
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mcp_server:
        condition: service_healthy
      llama-cpp:
        condition: service_started
    restart: on-failure
    logging: *default-logging

  # ──────────────────────────────────────────────────────────
  # GATEWAY profile: NGINX — Basic Auth + rate-limit + HTTPS
  # Access: https://localhost:8443/signal/, /regime/, /mlflow/, /grafana/
  # Credentials: GATEWAY_USER / GATEWAY_PASSWORD from .env
  # ──────────────────────────────────────────────────────────

  nginx:
    build:
      context: ./docker
      dockerfile: nginx.Dockerfile
    profiles: [gateway]
    environment:
      GATEWAY_USER: ${GATEWAY_USER:-pairlab}
      GATEWAY_PASSWORD: ${GATEWAY_PASSWORD:-pairlab}
    ports:
      - "8443:443"   # HTTPS — https://localhost:8443/signal/
      - "8444:80"    # HTTP — redirects to HTTPS
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/healthz 2>/dev/null | grep -q ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

volumes:
  postgres_data:
  minio_data:
  redis_data:
  redpanda_data:
  flink_checkpoints:
  spark_warehouse:
  loki_data:
  tempo_data:
  airflow_logs:
  grafana_data:
  mlflow_data:

networks:
  default:
    name: pairlab-network
