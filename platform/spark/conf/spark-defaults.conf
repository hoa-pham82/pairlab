# Spark defaults for pairlab platform
# JARs placed in ./spark/jars/ are mounted at /opt/spark/extra-jars/ inside containers
spark.driver.extraClassPath     /opt/spark/extra-jars/*
spark.executor.extraClassPath   /opt/spark/extra-jars/*
spark.sql.extensions                            io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                 org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.adaptive.enabled                      true
spark.sql.adaptive.coalescePartitions.enabled   true
spark.sql.adaptive.skewJoin.enabled             true

# S3A / MinIO defaults — credentials overridden per job via os.environ
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                    http://minio:4566
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.connection.ssl.enabled      false

# Delta optimize target file size: 128 MB
spark.databricks.delta.optimize.maxFileSize     134217728

# PyArrow writes nanosecond timestamps; tell Spark to treat them as microseconds
spark.sql.legacy.parquet.nanosAsLong            true
