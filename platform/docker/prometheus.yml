global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: signal_api
    static_configs:
      - targets: ["signal_api:8000"]

  - job_name: regime_api
    static_configs:
      - targets: ["regime_api:8001"]

  - job_name: mcp_server
    static_configs:
      - targets: ["mcp_server:8002"]

  - job_name: agent_api
    static_configs:
      - targets: ["agent_api:8003"]

  - job_name: online_writer
    static_configs:
      - targets: ["online_writer:9108"]

  - job_name: llama_cpp
    static_configs:
      - targets: ["llama-cpp:8080"]
    metrics_path: /metrics

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: pushgateway
    static_configs:
      - targets: ["pushgateway:9091"]
    honor_labels: true
