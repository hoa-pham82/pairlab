# pairlab gateway — rate limit, Basic Auth, HTTPS termination
# Uses Docker's internal resolver (127.0.0.11) so upstreams are resolved
# per-request; NGINX starts even if backend services are not yet up.
resolver 127.0.0.11 valid=10s;

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    auth_basic "pairlab";
    auth_basic_user_file /etc/nginx/htpasswd;

    # ── signal_api ────────────────────────────────────────────
    location /signal/ {
        limit_req zone=api burst=20 nodelay;
        set $signal http://signal_api:8000;
        proxy_pass         $signal/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── regime_api ────────────────────────────────────────────
    location /regime/ {
        limit_req zone=api burst=20 nodelay;
        set $regime http://regime_api:8001;
        proxy_pass         $regime/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── MLflow ────────────────────────────────────────────────
    location /mlflow/ {
        set $mlflow http://mlflow:5000;
        proxy_pass         $mlflow/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Grafana (own auth) ────────────────────────────────────
    location /grafana/ {
        auth_basic off;
        set $grafana http://grafana:3000;
        proxy_pass         $grafana/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Loki (logs UI / API) ──────────────────────────────────
    location /loki/ {
        set $loki http://loki:3100;
        proxy_pass         $loki/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Tempo (traces API) ────────────────────────────────────
    location /tempo/ {
        set $tempo http://tempo:3200;
        proxy_pass         $tempo/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── MCP server ────────────────────────────────────────────
    location /mcp/ {
        limit_req zone=api burst=10 nodelay;
        set $mcp http://mcp_server:8002;
        proxy_pass         $mcp/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Agent API (chat UI + coordinator) ─────────────────────
    location /agent/ {
        limit_req zone=api burst=20 nodelay;
        set $agent http://agent_api:8003;
        proxy_pass         $agent/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSE / streaming responses
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }

    # ── health / root ─────────────────────────────────────────
    location /healthz {
        auth_basic off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 200 "pairlab gateway\n";
        add_header Content-Type text/plain;
    }
}
