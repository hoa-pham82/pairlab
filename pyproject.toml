[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pairlab"
version = "0.1.0"
description = "Pairs-trading research platform: engine + data platform + ML + LLM-lite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyarrow>=16",
    "jinja2>=3.1",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = [
    "yfinance>=0.2",
    "websockets>=12",
]
ml = [
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "mlflow>=3.16",
    "deltalake>=0.18",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]
platform = [
    "apache-airflow>=2.9",
    "pyspark>=3.5",
    "feast>=0.40",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "kafka-python>=2.0",
    "kafka-python-ng>=2.2.3",
]
services = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
    "feast[postgres]>=0.66",
    "redis>=4.2",
    "psycopg2-binary>=2.9",
    "mlflow>=3.16",
    "lightgbm>=4.3",
    "joblib>=1.4",
]
llm = [
    "fastmcp>=0.1",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.103",
    "mutmut>=2.4",
    "ruff>=0.4",
    "quantstats>=0.0.62",
    "vectorbt>=0.26",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "locust>=2.29",
    "httpx>=0.27",
]

[project.scripts]
pairlab = "pairlab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pairlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pairlab --cov=ml --cov=services --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["pairlab", "ml", "services"]
omit = [
    "*/locustfile.py",    # load-test runner, not a library module
    "ml/build_labels.py", # standalone CLI script
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mutmut]
paths_to_mutate = ["services/", "ml/labels.py", "ml/dataset.py"]
tests_dir = ["tests/services/", "tests/unit/test_labels.py", "tests/unit/test_dataset.py"]
do_not_mutate = ["services/signal_api/locustfile.py"]
also_copy = ["ml/", "tests/"]
pytest_add_cli_args = ["-o", "addopts=", "-p", "no:cacheprovider"]

[dependency-groups]
dev = [
    "boto3>=1.43.108",
    "diagrams>=0.25.1",
    "feast>=0.66.0",
    "psycopg-pool>=3.3.3",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
]
